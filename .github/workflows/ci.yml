name: CI

on:
  push:
    branches: [ master, main, 'claude/**', 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18.x, 20.x, 22.x]
        include:
          # The CLI targets Windows too: exercise it on at least one version
          - os: windows-latest
            node-version: 20.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` must fail loudly: the previous `|| npm install` fallback
      # silently hid an out-of-sync lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        run: npm run test:coverage

  self-audit:
    name: flash-dev s'audite lui-même
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      # The tool must pass its own security gates before it ships
      - name: Analyse de sécurité statique
        run: node bin/index.js scan

      - name: Audit des licences
        run: node bin/index.js licenses --fail-on strong

      - name: Vérification des vulnérabilités npm
        run: npm audit --audit-level=high
        continue-on-error: true
